name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts; remove this if you want drafts reviewed too
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the repository's CLAUDE.md first and
            enforce its conventions (services layer for all HTTP calls, endpoints
            only in src/config/constant.ts, single-source-of-truth files for
            roles/nav/onboarding steps, semantic Tailwind tokens, no manual
            useMemo/useCallback since React Compiler is enabled).

            Focus on:
            - Correctness bugs and broken edge cases in the changed code
            - Violations of the project conventions above
            - TypeScript type safety issues (unsafe casts, any, missing types in api.types.ts)
            - React/Next.js App Router pitfalls (missing "use client", hooks misuse,
              client/server component boundaries)
            - Security issues (XSS, secrets in code, trusting client-side JWT for authorization)

            Post your feedback as inline comments on the specific lines using the
            mcp__github_inline_comment__create_inline_comment tool. Only comment on
            real issues — do not leave nitpicks or praise comments. Finish with one
            short summary comment on the PR (via gh pr comment) that lists the issues
            found, or states the PR looks good if there are none.

            Do not push commits or modify any code.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
